name: 2. Deploy to EC2 via SSM

on:
  workflow_run:
    workflows: [ "1. Test & Build Docker Image" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-ec2-ssm:
    name: Deploy to EC2 via AWS Session Manager (Docker Compose)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Execute Deployment Commands via SSM Run Command
        run: |
          echo "🚀 Deploying to EC2 via AWS SSM Run Command..."

          # Sanitize inputs (strip trailing/leading spaces, newlines, carriage returns)
          INSTANCE_ID=$(echo "${{ secrets.EC2_INSTANCE_ID }}" | tr -d '[:space:]')
          REGION=$(echo "${{ secrets.AWS_REGION || 'us-east-1' }}" | tr -d '[:space:]')
          DOCKERHUB_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]')

          echo "Target Instance ID: [$INSTANCE_ID]"
          echo "Target Region:      [$REGION]"

          # Check SSM connectivity status before sending command
          echo "🔍 Checking if instance is recognized by SSM..."
          aws ssm describe-instance-information \
            --region "$REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[*].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
            --output table

          # Define the commands to run on EC2
          COMMANDS=$(cat << EOF
          set -e
          APP_DIR="/home/ssm-user/apps/gadk-backend"

          echo "📁 Ensuring directory structure exists..."
          mkdir -p "\$APP_DIR"
          cd "\$APP_DIR"

          # Export DOCKER_IMAGE dynamically using GitHub Secret
          export DOCKER_IMAGE="${DOCKERHUB_USER}/business-ops-backend:latest"

          # Create docker-compose.yml on EC2 if not present
          if [ ! -f docker-compose.yml ]; then
            echo "📄 Creating docker-compose.yml..."
            cat << 'COMPOSE_EOF' > docker-compose.yml
version: '3.8'

services:
  backend:
    image: \${DOCKER_IMAGE}
    container_name: gadk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
COMPOSE_EOF
          fi

          # Ensure .env.prod exists
          if [ ! -f .env.prod ]; then
            echo "⚠️ Warning: .env.prod not found, creating an empty placeholder..."
            touch .env.prod
            chmod 600 .env.prod
          fi

          echo "📦 Pulling latest Docker image (\$DOCKER_IMAGE)..."
          docker compose -p gadk-backend pull

          echo "🔄 Restarting container with zero downtime..."
          docker compose -p gadk-backend up -d --remove-orphans

          echo "🧹 Pruning unused images..."
          docker image prune -f

          echo "✅ Deployment completed successfully!"
          docker compose -p gadk-backend ps
          EOF
          )

          # Send the command via AWS SSM Run Command
          COMMAND_ID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy gadk-backend via Docker Compose" \
            --parameters "commands=[$(echo "$COMMANDS" | jq -R -s -c .)]" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          # Wait for SSM command execution without crashing immediately so we can read error logs
          aws ssm wait command-executed \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          # Fetch execution status
          STATUS=$(aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Deployment Status: $STATUS"

          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "--- STDERR ---"
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
