name: 2. Deploy to EC2 via SSM

on:
  workflow_run:
    workflows: [ "1. Test & Build Docker Image" ]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-to-ec2-ssm:
    name: Deploy to EC2 via AWS Session Manager (Docker Compose)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Execute Deployment Commands via SSM Run Command
        run: |
          echo "🚀 Deploying to EC2 via AWS SSM Run Command..."

          # Define the commands to run on EC2
          COMMANDS=$(cat << 'EOF'
          set -e
          APP_DIR="/home/ssm-user/apps/gadk-backend"

          echo "📂 Navigating to $APP_DIR..."
          cd "$APP_DIR"

          echo "📦 Pulling latest Docker image..."
          docker compose -p gadk-backend pull

          echo "🔄 Restarting container with zero downtime..."
          docker compose -p gadk-backend up -d --remove-orphans

          echo "🧹 Pruning unused images..."
          docker image prune -f

          echo "✅ Deployment completed successfully!"
          docker compose -p gadk-backend ps
          EOF
          )

          # Send the command via AWS SSM Run Command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy gadk-backend via Docker Compose" \
            --parameters "commands=[$(echo "$COMMANDS" | jq -R -s -c .)]" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          # Wait for SSM command execution to finish
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Fetch execution status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment Status: $STATUS"

          # Print stdout
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            # Print stderr if failed
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
